version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: blockmemory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blockmemory
      POSTGRES_PASSWORD: blockmemory_dev
      POSTGRES_DB: blockmemory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockmemory -d blockmemory"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: blockmemory-redis
    restart: unless-stopped
    command: redis-server --requirepass blockmemory_dev
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "blockmemory_dev", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
