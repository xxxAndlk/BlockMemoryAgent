# BlockMemoryAgent Skill 池配置（v3 §5）
#
# 每个 Skill 是结构化对象：DomainAgent 在初始化时按 domain 字段
# 筛选出与本领域相关的 Skill 子集，再交给 LLM 二次精简后下发。
#
# 严禁把整个 Skill 池暴露给子 Agent（参见 v3 §2.2 / §5.3）。

skills:
  # ---- 文件 / 代码类 ----
  - skill_id: read_file
    name: 读取文件
    description: 读取本地文件并返回文本内容
    domain: code,doc,*
    tool_ref: ReadFile
    tags: [io, fs]

  - skill_id: write_file
    name: 写入文件
    description: 把文本内容写入本地文件
    domain: code,doc,*
    tool_ref: WriteFile
    tags: [io, fs]

  - skill_id: list_dir
    name: 列出目录
    description: 列出目录中的文件与子目录
    domain: code,*
    tool_ref: ListDir
    tags: [io, fs]

  - skill_id: search_in_files
    name: 代码搜索
    description: 在工作目录中按关键词搜索文件内容
    domain: code,doc,*
    tool_ref: SearchInFiles
    tags: [search]

  - skill_id: run_command
    name: 执行命令
    description: 在沙箱内执行 shell 命令并返回输出
    domain: code,ops,*
    tool_ref: RunCommand
    tags: [shell]

  # ---- HTTP / API 类（AIOps 测试场景使用） ----
  - skill_id: http_get
    name: HTTP GET
    description: 对指定 URL 发起 GET 请求并返回 JSON/文本
    domain: ops,api,*
    tool_ref: HTTPGet
    tags: [http]

  - skill_id: http_post
    name: HTTP POST
    description: 对指定 URL 发起 POST 请求（带 JSON Body）
    domain: ops,api,*
    tool_ref: HTTPPost
    tags: [http]

  # ---- Git 类（P3-2） ----
  - skill_id: git_diff
    name: Git Diff
    description: 查看工作区/暂存区/历史提交的 Git 差异
    domain: code,*
    tool_ref: GitDiff
    tags: [git,vcs]

  - skill_id: git_status
    name: Git Status
    description: 查看 Git 工作区简短状态
    domain: code,*
    tool_ref: GitStatus
    tags: [git,vcs]

  - skill_id: git_log
    name: Git Log
    description: 查看 Git 提交历史
    domain: code,*
    tool_ref: GitLog
    tags: [git,vcs]

  - skill_id: git_blame
    name: Git Blame
    description: 查看文件每行最后修改者
    domain: code,*
    tool_ref: GitBlame
    tags: [git,vcs]
