# BlockMemoryAgent 基础设施配置

# PostgreSQL 配置
postgres:
  dsn: ${POSTGRES_DSN:"postgres://user:pass@localhost:5432/blockmemory?sslmode=disable"}
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 300  # 秒

# pgvector 配置（依赖 PostgreSQL）
pgvector:
  enabled: true
  dimensions: 1024  # bge-m3=1024 维（2026-08-12 切换 ollama 本地模型）；BGE-base-zh 用 768
  index_type: ivfflat  # ivfflat | hnsw
  distance_metric: cosine  # cosine | l2 | inner_product

# Redis 配置
redis:
  addr: ${REDIS_ADDR:"localhost:6380"}
  password: ${REDIS_PASSWORD:""}
  db: 5
  pool_size: 10
  min_idle_conns: 3
  dial_timeout: 5000
  read_timeout: 3000
  write_timeout: 3000
  snapshot_ttl_days: 7

# HTTP 服务配置
http:
  addr: ${HTTP_ADDR:":10010"}
  read_timeout: 30   # 秒
  write_timeout: 30  # 秒
  auth_enabled: true                     # 是否启用 Token 鉴权（推荐生产环境开启）
  auth_token: ${BMA_API_TOKEN:""}        # API Token，建议通过环境变量注入

# 记忆系统配置
memory:
  write_batch_size: 100
  write_flush_interval: 5  # 秒
  snapshot_interval: 300  # 秒

# Agent 运行时动态参数
agent:
  # 测试助手交付验收开关（2026-09-12）为工作目录级配置，不在本文件：
  # 见 <工作目录>/.bma/tester.yaml（mode: off|auto|on，默认 off；GET/PUT /api/project/tester-config 读写）。
  # -- ReAct 主循环 --
  summarize_every: 10            # 退役字段：原步频压缩扳机（每 N 步强制压缩），实测与上下文实际大小脱钩、致 Agent 每 10 步强制失忆反复重读文件。压缩已仅由 token 阈值（token_budget_per_role/context_token_budget，150K）驱动——唯一闸门。保留解析不报错，不再驱动任何逻辑（同 token_budget_per_goal 退役先例）
  summarize_keep_recent: 15      # 保留最近 15 条（2026-08-21 由 10 上调：压缩丢工具结果细节致领域 Agent 重读文件白烧慢思考轮；多留 5 条原始消息）
  summarize_max_bundles: 20      # 层级压缩包数量上限：每次压缩触发把新滑出保留段的中段压成一个结构化压缩包（轻量模型），超上限把最老的一半合并为 1 个更粗的包，循环往复——旧上下文渐变式遗忘而非 200 字符截断后丢弃；压缩状态落 agent_compress_states 表，重启后懒加载恢复
  summarize_timeout_sec: 120     # 事件摘要轻量模型调用超时（秒）。思考型模型首 token 需数十秒，旧硬编码 5s 致摘要全挂、上下文全量回注、token 预算提前烧穿（实证 verify 子 Agent 300K 预算 7 分钟耗尽）
  salvage_llm_timeout_sec: 60     # 失败打捞轻量调用超时（秒，默认 30）。旧硬编码 5s 对思考型模型来不及出首 token，打捞 facts=0 全降级（TODO #33）；当前轻量模型为推理系，取 60s 下限
  history_max_messages: 400      # 滑动窗口硬上限（system 前缀 + 最近消息），纯兜底防爆：压缩已仅由 token 阈值（150K）驱动、先于窗口动手，窗口 48 会抢在阈值前裁剪成新的隐性失忆点，故放大到 400——按 tool_output_history_max_runes=20000 估算极端情形仍可能超 react_llm 端点实际上下文，保留硬上限防 API 溢出；负数表示不裁剪（不推荐，会失去兜底）
  tool_call_max_rounds: -1       # ReAct 最大 LLM 轮数（达到上限暂停等待用户续跑，不判失败），负数表示不限制
  retry_count: 1                 # Assistant 任务指数退避重试次数。provider 层已有 3 次重试（retry_provider），此处再重试会乘法放大尝试次数（最多 provider3 × agent(1+n)），瞬时故障已被下层覆盖，1 次足够
  retry_backoff_ms: 100          # 重试初始退避时长（毫秒）
  dispatch_retry_count: 1        # 叶子助手 kind=error 失败的自动重派次数（TODO #23 最小一档：同任务重跑一次）；domain/timeout/killed/loop_guard 不自动重试，交 MetaAgent 决策。与 retry_count 正交（那层重试模型调用本身）
  session_max_wall_clock_min: 0  # 会话全局墙钟上限（分钟，TODO #25 硬止损）：从创建起超时未终止则级联取消全部子节点 + 会话置 error"超全局时限"；0=关闭（默认）
  domain_heartbeat_timeout_min: 0  # DomainAgent 心跳超时（分钟，TODO #25 防误杀版）：0=默认 2× sub_agent_heartbeat_timeout_min；等子/等回信靠后代活动冒泡保活
  ask_user_timeout_sec: 0        # ask_user 提问默认超时（秒，TODO #24 人在回路）：0=不限；>0 超时未答复工具返回"用户未答复，自行决策"。单次调用 timeout_sec 参数覆盖
  reflection_max_rounds: 3       # 派发 mode=reflection 时自检不达标重试轮数上限（TODO #29 三引擎）：每轮 ≈ +1 次辅助 LLM 调用；强模型下 2 轮偏紧放开到 3
  plan_execute_max_steps: 12     # 派发 mode=plan_execute 时最大执行步数（TODO #29 三引擎）：超限强制收口终答；多阶段复杂装配 8 步偏紧放开到 12
  judge_role: prompt_reviewer    # 校验 judge 角色（TODO #43 交叉模型）：reflection/rubric 校验取该角色 provider 作评审（deepseek-v4-flash，与被审角色不同模型，防同模型自评放水）；裸 LLM 调用不派 Agent，取不到回退同角色
  task_max_runes: 3000           # 派发 task 文本软上限（TODO #35 放开预算）：超软限未达硬限放行附压缩警告；原 2000 偏紧逼压缩丢契约细节
  task_max_runes_hard: 4000      # 派发 task 文本硬上限（TODO #35）：超硬限拒绝；仍拦截全量规格转贴（事故日志 3521/2315 runes 区间已上移）
  react_llm_timeout_sec: 1800    # ReAct 单次 LLM 调用超时（秒），负数表示仅受会话取消控制。glm-5.2 推理模型 thinking 慢,180s 常被截断；600s 仍不够——2026-08-13 实证 MetaAgent 汇总轮（4 领域摘要 ~20K input）10 分钟被掐断,整品验收没派出去,故 600->1200；2026-08-20 ark glm-5.3 流式两次中途静默(440s/15min+),1200->1800 给慢思考留满余量。配合 generate() 不在 deadline 上重试,卡死时 1800s 即报错。
  sub_agent_timeout_min: 120     # 子 Agent 独立执行超时（分钟），负数表示不限制。TODO #35 放开预算：60->120，慢推理（thinking）下长任务不再撞超时。
  domain_recon_wall_clock_min: -1 # Domain 侦察墙钟（分钟）：domain 派发无显式 wall_clock_min 时的默认预算，中点邮件预警"停止侦察开始产出"。2026-08-21 慢任务修复：实证炮塔领域 Agent 1.5h 全程"契约反推"侦察零交付；0=关闭回退全局值。同日下午实证 domain 换 glm-5.3 后单轮 LLM 5-25min，30min 墙钟装不下侦察+建设三连杀（domain-1/3/4 全 FAIL 30m0.00s），-1=禁用回退全局 sub_agent_timeout_min。
  engine_llm_timeout_sec: -1     # 引擎辅助 LLM（reflection 自检 judge / plan_execute 规划）单次调用超时（秒）。该路径不走 CallLLM 包装,只吃 SDK 默认 600s/请求,provider 3 次重试 × judge 内部重试叠加曾烧 70 分钟直到墙钟强杀（2026-08-19 引擎 Agent 事故）；300s 包住整次调用含 provider 重试,到期快速失败。2026-08-21 下午实证 judge 角色被成本重排换成 glm-5.3（thinking）后 300s 内出不了判定 JSON，judge 2 连超时→fail-closed unverified，把当天所有成功任务（文件已落盘）标成 FAIL（domain-2/3/4/5 四连杀）；-1=禁用独立超时，judge 只受子 Agent 墙钟约束。
  tool_output_history_max_runes: 20000 # 写入历史的单条工具输出最大字符数，负数表示不截断。ReadFile 行区间分页默认 200 行/页（read_file_max_chars 默认 16000 字符，ASCII 整页约 16000 runes），20000 保证整页内容完整进入历史，模型无需为"看不见刚读的下半页"重复读取
  tool_result_dump_runes: 8000   # 工具结果统一收口（TODO 第9项②）：单条工具输出超此 rune 数全文落盘 <workDir>/.bma/tool_outputs/，历史只留头 tool_result_digest_runes 摘录 +【全文已落盘】路径（模型按需 ReadFile 取全文）；落盘失败降级原样截断；负数=关闭
  tool_result_digest_runes: 2000 # 收口后保留的头部摘录 rune 数（TODO 第9项②）
  stale_tool_evict_rounds: 20    # 陈旧工具结果驱逐（TODO 第9项③）：N 轮前（按 assistant 轮序）ReadFile/SearchInFiles 结果在请求视图替换为"已驱逐需重读"占位符（需重读时按原参数重新 ReadFile）；只影响请求不改持久化历史；验证证据类工具（RunCommand 等）不驱逐；负数=关闭
  image_max_edge: 1024           # 工具图片长边降采样上限（TODO 第9项④，像素）：png/jpeg 超限等比缩小（不放大小图），原图落盘 <workDir>/.bma/images/ 并在输出附「原图已落盘」路径；gif/webp 与缩放失败原图直通；确定性缩放保持截图指纹去重语义；负数=关闭
  agents_md_max_runes: 4000      # AGENTS.md/CLAUDE.md 项目自述自动注入上限（TODO 第10项⑦，rune）：workDir 根部 AGENTS.md 优先、其次 CLAUDE.md，以【项目自述】段注入 envBlock 与派发前缀首位（mtime 缓存，缺失零开销）；负数=关闭
  tool_parallel_enabled: true    # 轮内并行工具执行（TODO 第9项①）：同轮多个 tool_calls 无依赖调用并发派发（墙钟≈最慢一个），结果按原序串行回填；写类工具同路径互斥防竞写；false=退回逐个串行
  tool_parallel_max_concurrency: 4 # 轮内并行工具并发上限（TODO 第9项①）：信号量限流，防同轮大量 tool_calls 打满下游（子 Agent 派发/命令子进程）；<=0 按默认 4
  trust_mode: full-auto          # 默认信任模式（TODO 第10项⑥，会话级三档，对标 Codex）：suggest=全部变更类动作（写文件/命令/插件破坏性工具）逐条推「需确认」，读类直通 | auto-edit=文件编辑直通，命令与插件破坏性工具审批 | full-auto=全自主（现状默认）。新建会话取此值为初始档，会话内可经 POST /api/sessions/{id}/trust-mode 或 TUI /approval 随时切换（下一工具调用生效）；非法值回落 full-auto
  worktree_enabled: true         # worktree 隔离派发开关（TODO 第9项⑤/#10项⑤）：允许 call_sub_agent 携带 worktree=true 派发到 git worktree 副本（子 Agent 全部文件写入落在 <repoRoot>/.bma/worktrees/ 副本，主目录零写入；成功收尾产出全量 patch，meta 经 merge_worktree 工具 review/merge/reject 走合并门：base 漂移检测→跨域契约检查→git apply）；与 reuse_agent_id 互斥，热驻 domain 不支持；false=拒绝 worktree 参数；主目录非 git 仓库时派发侧同样拒绝（不静默降级）
  token_budget_per_goal: 300000   # 退役字段（原累计跨轮 token 预算，已替换为按角色上下文阈值）。保留不破坏旧配置加载，不再驱动任何闸门。
  token_budget_per_role:          # 按角色上下文 token 阈值（替换原累计预算）：Assemble 压缩后估算 messages token >= 阈值即暂停（近 N 单独就超、压不下去），每轮独立估算（各 Agent 独立）。未列角色默认 150000。
    domain: 150000
    meta: 150000  # 2026-09-06 round-11 实测：40K 全程未触发压缩（上下文自由长到 46.8K，估算口径低于 API 实测），对成绩无影响；回滚默认消除未测风险。真正的 meta 减重靠 user_profile.md 去重（111→27 行）
    code_assistant: 150000
    ui_assistant: 150000
    prompt_reviewer: 150000
    code_reviewer: 150000
    test_assistant: 150000
    doc_assistant: 150000
  context_token_budget: 150000   # 上下文 token 阈值默认值（未在 token_budget_per_role 列出的角色用此值）。替换原累计预算：每 Agent 独立估算上下文 token，达阈值即压缩（保留近 10，旧压成上下文内摘要块）；压缩后仍超=近 10 单独就超，暂停等续跑。<=0 不限制。
  video:                         # 用户消息视频附件（TUI Alt+V 粘贴视频文件）处理参数；0 值字段回落默认
    mode: native                 # 视频消费模式：native=默认，≤ native_max_mb 的视频整个直传 video_url（Ark doubao-seed/GLM 等 OpenAI 兼容视频理解模型原生消费，已对照火山文档 82379/1895586 确认格式，模型获得完整时间维度信息；直传 MIME 仅 mp4/avi/mov，webm/mkv 自动回落抽帧，ffmpeg 缺失再降级元数据）| frames=显式退出，全部抽关键帧走图片链路（anthropic 等无视频 API 的 provider 组合必须显式配 frames，否则视频内容被其白名单静默丢弃）
    native_max_mb: 32            # native 模式单视频直传上限 MB（base64 后约 ×1.37 进请求体；端点硬约束视频 ≤50MB 且请求体 ≤64MB → 理论上限约 46；默认 32 留余量，超限仍回落抽帧）
    frame_count: 6               # 每个视频抽取的关键帧数（默认 6，约 6K token/视频）
    frame_max_pixels: 1024       # 帧长边像素上限（默认 1024，不放大小图）
    max_video_mb: 200            # 单视频大小上限 MB（默认 200）
    extract_timeout_sec: 25      # 抽帧整体超时秒（默认 25，必须小于 http.write_timeout 30s）
    # ffmpeg_bin: ffmpeg         # ffmpeg 可执行文件（默认 PATH 探测；缺失时降级为仅元数据文本，消息照常发送）
    # ffprobe_bin: ffprobe       # ffprobe 可执行文件（默认 PATH 探测）
  paused_domain_max_resumes: 2   # 同一 Paused DomainAgent 允许的最大续跑次数。续跑重置 fresh token 预算，不设上限则"触限-暂停-续跑"环路永不绑定（实证 v10 基准验收领域研磨 32 轮 30 分钟不收敛）；触顶后强制收口：部分产出返回父 Agent 并标 Done，由 MetaAgent 决定返工。TODO #35 放开：1->2 多给一次续跑机会
  context_window: 65536          # Agent 上下文窗口（token 数），驱动 TokenBudget 分配与 Watchdog 阈值

  # -- DAG / 会话恢复 --
  dag_enabled: false             # DAG 定时任务调度（默认关闭）
  restore_sessions: true         # 启动时从 session_history 恢复最近 50 个会话到内存（Web 重启续聊依赖此预热；列表合并与懒恢复不受此开关影响，关闭仅跳过预热）

  # -- 验证机制：分层自检（2026-08-08 起，替代已下线的 verifyloop 测试助手自动验证）--
  # 叶子 Agent 自检（写完即语法检查）；领域 Agent 对叶子产出做整体性验收，不过则返工叶子；
  # MetaAgent 对所有领域产出做整品验收，不过则返工领域。均走提示词纪律，无独立验证 Agent。
  # A/B 实证自动验证闭环是负资产（开 5/16 + 558 万 token vs 关 16/16 + 284 万 token），
  # 业务级测试（computer-use 点击页面 / CLI 跑命令断言）移至 doc/扩展设计_Agent工作流平台.md §12 作后期扩展。
  block_memory_write_enabled: true   # 子 Agent 完成后沉淀结果摘要到块记忆知识库

  # -- 强制门（spec 强制默认开启：塔防实证 WriteSpec 有用；Pipeline 重构后由 PlanStage 替代）--
  spec_enforcement_enabled: true     # call_sub_agent 前是否强制 WriteSpec
  max_total_dispatches: 30           # 单 session 派发总数上限
  # -- 计划确认（下级中大型任务先出计划给上级确认，批准后才执行；对照 Claude Code 差距分析 2026-08-29）--
  plan_confirmation_enabled: true   # 开关：子 Agent 任何任务动手前 submit_plan 阻塞等上级确认（无大小豁免）；false=直通不阻塞
  plan_confirm_timeout_sec: 600     # 单次审批等待超时（秒）：超时 fail-open 按计划继续，防上级忙线时下级永久挂起
  plan_max_revisions: 0             # 每 Agent 计划被驳回重提上限：0=不限制，循环修订直到上级批准；>0 达上限不放行、转 escalate 升级仲裁（防失控兜底）
  prompt_enhance: true               # 用户输入自动提示词补全（TODO #36 Phase 0 规则版）：命中续跑/控制/诊断意图时附加【系统补全】段（意图标签+最近失败/未完成任务绑定），只增不改用户原文；false=原样直通
  prompt_enhance_llm: true           # L2 轻量模型仲裁开关（TODO #39）：灰区输入（L1 未命中但句中有弱词信号）调轻量模型四分类（none/resume/control/diagnose）；超时/失败/低置信一律按普通任务直通（宁漏判不误判）；false=降级纯规则（Phase 0 行为）
  prompt_enhance_llm_timeout_sec: 10 # L2 仲裁单次超时秒（TODO #39）：轻量模型首 token 慢，宁短超时降级也不阻塞用户输入（最坏延迟=本值）
  prompt_enhance_max_input_runes: 30 # L0 输入形态闸门长度上限（rune，TODO #39）：续跑/控制/诊断本质是短指令（实证 ≤15 字），超过视为任务描述直接直通不分类
  stop_destroy_countdown_sec: 300    # 软停止销毁倒计时（秒，TODO #37）：双击 ESC 停止后到期未续跑则硬销毁全部任务节点；负数=关闭（永久暂停，靠续跑）

  # -- DomainAgent 热驻留 + 复用权重 --
  domain_hot_resident_enabled: true  # DomainAgent 热驻留总开关：true 时 domain 任务完成/用户停止后转 Idle 热驻（goroutine 挂起等复用，复用经 call_sub_agent(reuse_agent_id=X)），false=旧行为（完成即销毁）
  domain_idle_base_ttl_min: 30        # Idle 基础寿命（分钟）：用户下一条消息武装倒计时后的存活基数
  domain_idle_extend_on_reuse_min: 30 # 每次成功复用延长量：复用时 reuse_count+1 且 TTL 重置为 min(base+reuse*extend, max)
  domain_idle_max_ttl_min: 240        # 加权倒计时上限（分钟）
  domain_idle_max_per_session: 4      # 单 session 热驻 domain 上限；超限新 domain 进 Idle 前 LRU 淘毁最旧 idle
  domain_idle_task_queue_len: 4       # 忙碌 domain 新任务缓冲上限；超限拒绝派发提示父 Agent 稍后重派
  domain_reuse_roster_inject: true    # 向 MetaAgent 上下文注入【空闲领域Agent】清单（ID/方向/reuse_count/剩余寿命），由其自主判定强相关复用 vs 弱相关新建

  # -- 工具沙箱（安全）--
  tool_sandbox_disabled: false   # true 时关闭写路径逃逸检测（保留命令黑名单）
  tool_approval_disabled: true   # 全信任模式：true 关闭全部破坏性操作审批（WriteFile/EditFile 生产写入、RunCommand 危险命令模式、插件 Destructive 工具一律直接执行，不再推「需确认」）。2026-08-30 事故动机：computer_use 插件全工具自标 destructive，视频诊断会话 list/read/wait 等无害只读调用也被拦 30+ 次，审批风暴吃掉整晚墙钟。仅关确认链，命令黑名单（hard block）与写路径沙箱不受影响；单人开发机可开，多人/生产环境保持 false
  tool_sandbox_allowed_paths: [] # 允许读写的额外绝对路径白名单
  tool_sandbox_blocked_cmds: []  # 追加到默认命令黑名单的额外命令
  production_workdir: ""         # 生产环境工作目录（绝对路径）；非空时其下的破坏性操作（WriteFile/写类命令）需用户确认；空=仅危险命令模式（git push/rm -rf 等）需确认

# 日志文件输出（按天分割，按入口分文件）
# 后端入口 -> logs/backend/YYYY-MM-DD.log
# TUI 入口 -> logs/tui/YYYY-MM-DD.log
logging:
  enabled: true                  # false 时仅输出到 stderr，不写文件
  dir: logs                      # 日志目录，自动创建
  format: console                # console（纯文本，便于阅读）或 json（结构化）
  level: info                    # debug | info | warn | error
  timezone: Local                # Local | UTC | Asia/Shanghai
  stack_enabled: true            # error 级别是否打印调用栈
  no_color: true                 # 是否禁用 ANSI 颜色，文件日志建议 true
