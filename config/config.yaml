# BlockMemoryAgent 基础设施配置

# PostgreSQL 配置
postgres:
  dsn: ${POSTGRES_DSN:"postgres://user:pass@localhost:5432/blockmemory?sslmode=disable"}
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 300  # 秒

# pgvector 配置（依赖 PostgreSQL）
pgvector:
  enabled: true
  dimensions: 768
  index_type: ivfflat  # ivfflat | hnsw
  distance_metric: cosine  # cosine | l2 | inner_product

# Redis 配置
redis:
  addr: ${REDIS_ADDR:"localhost:6379"}
  password: ${REDIS_PASSWORD:""}
  db: 5
  pool_size: 10
  min_idle_conns: 3
  dial_timeout: 5000
  read_timeout: 3000
  write_timeout: 3000
  snapshot_ttl_days: 7

# HTTP 服务配置
http:
  addr: ${HTTP_ADDR:":10010"}
  read_timeout: 30   # 秒
  write_timeout: 30  # 秒

# 记忆系统配置
memory:
  write_batch_size: 100
  write_flush_interval: 5  # 秒
  snapshot_interval: 300  # 秒
