# BlockMemoryAgent 基础设施配置

# PostgreSQL 配置
postgres:
  dsn: ${POSTGRES_DSN:"postgres://user:pass@localhost:5432/blockmemory?sslmode=disable"}
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 300  # 秒

# pgvector 配置（依赖 PostgreSQL）
pgvector:
  enabled: true
  dimensions: 768
  index_type: ivfflat  # ivfflat | hnsw
  distance_metric: cosine  # cosine | l2 | inner_product

# Redis 配置
redis:
  addr: ${REDIS_ADDR:"localhost:6380"}
  password: ${REDIS_PASSWORD:""}
  db: 5
  pool_size: 10
  min_idle_conns: 3
  dial_timeout: 5000
  read_timeout: 3000
  write_timeout: 3000
  snapshot_ttl_days: 7

# HTTP 服务配置
http:
  addr: ${HTTP_ADDR:":10010"}
  read_timeout: 30   # 秒
  write_timeout: 30  # 秒
  auth_enabled: true                     # 是否启用 Token 鉴权（推荐生产环境开启）
  auth_token: ${BMA_API_TOKEN:""}        # API Token，建议通过环境变量注入

# 记忆系统配置
memory:
  write_batch_size: 100
  write_flush_interval: 5  # 秒
  snapshot_interval: 300  # 秒

# Agent 运行时动态参数（替代散落在 graph 包中的硬编码常量）
agent:
  # —— Graph 死循环防护（三层防御，替代硬步数上限）——
  stall_steps: 30                # 无进展步数阈值：连续 N 步状态指纹无变化 → 判死循环
  max_repeat_fingerprint: 3      # 状态指纹重复阈值：同一指纹连续出现 N 次 → 判死循环
  session_timeout_min: 240       # 单次 Graph Invoke 的 wall-clock 超时（分钟），防 LLM/工具卡死
  skill_set_size: 8              # 每个 DomainAgent 装配的 Skill 子集上限
  tool_call_max_rounds: 100      # Assistant ReAct 工具调用循环最大轮数（含循环检测提前退出）
  retry_count: 3                 # Assistant 任务指数退避重试次数
  retry_backoff_ms: 100          # 重试初始退避时长（毫秒）
  llm_soft_timeout_sec: 30       # LLM 软超时（建议取消）
  llm_hard_timeout_sec: 90       # LLM 硬超时（强制取消）
  context_window: 65536          # Agent 上下文窗口（token 数），驱动 TokenBudget 分配与 Watchdog 阈值
  snapshot_summary_count: 20     # 私有快照保留的最近 Episode 摘要条数（默认 20）
  snapshot_open_issue_threshold: 0.7 # 未决问题重要性阈值（默认 0.7）
  summary_max_runes: 400         # Episode 摘要最大 rune 数（默认 400）
  fact_max_sentences: 5          # 事实提取最大句数（默认 5）
  compress_importance_threshold: 0.7 # 压缩保留 Raw 的重要性阈值（默认 0.7）
  compress_age_hours: 24         # 压缩保留 Raw 的最大年龄（小时，默认 24）
  # 以下特性保留代码但默认关闭（P1-3：TODO 暂不做）
  interrupt_enabled: false       # 抢占中断（默认关闭）
  queue_inject_enabled: false    # 队列注入（默认关闭）
  human_clarify_enabled: false   # 人机对话（默认关闭）
  dag_enabled: false             # DAG 定时任务调度（默认关闭）
  plan_enabled: false            # Plan-and-Execute（默认关闭）
  reflection_enabled: false      # Self-Reflection（默认关闭）
  human_clarify_timeout_sec: 120 # 等待用户回答超时（秒）
  # 工具沙箱（安全）
  tool_sandbox_disabled: false   # true 时关闭写路径逃逸检测（保留命令黑名单）
  tool_sandbox_allowed_paths: [] # 允许读写的额外绝对路径白名单
  tool_sandbox_blocked_cmds: []  # 追加到默认命令黑名单的额外命令

# 插件预留配置（P3-5）：接口先定，实现后做，默认全部关闭
plugins:
  mcp:
    enabled: false               # MCP 工具接入
  rag:
    enabled: false               # 外部 RAG 知识源接入
  computer_use:
    enabled: false               # Computer Use 浏览器/GUI 自动化

# 日志文件输出（按天分割，按入口分文件）
# 浏览器入口 → logs/browser-YYYY-MM-DD.log
# TUI 入口    → logs/tui-YYYY-MM-DD.log
logging:
  enabled: true                  # false 时仅输出到 stderr，不写文件
  dir: logs                      # 日志目录，自动创建
