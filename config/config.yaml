# BlockMemoryAgent 基础设施配置

# PostgreSQL 配置
postgres:
  dsn: ${POSTGRES_DSN:"postgres://user:pass@localhost:5432/blockmemory?sslmode=disable"}
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 300  # 秒

# pgvector 配置（依赖 PostgreSQL）
pgvector:
  enabled: true
  dimensions: 768
  index_type: ivfflat  # ivfflat | hnsw
  distance_metric: cosine  # cosine | l2 | inner_product

# Redis 配置
redis:
  addr: ${REDIS_ADDR:"localhost:6380"}
  password: ${REDIS_PASSWORD:""}
  db: 5
  pool_size: 10
  min_idle_conns: 3
  dial_timeout: 5000
  read_timeout: 3000
  write_timeout: 3000
  snapshot_ttl_days: 7

# HTTP 服务配置
http:
  addr: ${HTTP_ADDR:":10010"}
  read_timeout: 30   # 秒
  write_timeout: 30  # 秒
  auth_enabled: true                     # 是否启用 Token 鉴权（推荐生产环境开启）
  auth_token: ${BMA_API_TOKEN:""}        # API Token，建议通过环境变量注入

# 记忆系统配置
memory:
  write_batch_size: 100
  write_flush_interval: 5  # 秒
  snapshot_interval: 300  # 秒

# Agent 运行时动态参数
agent:
  # -- ReAct 主循环 --
  summarize_every: 5             # 每 5 步压缩；<=0 关闭
  summarize_keep_recent: 10      # 保留最近 10 条
  summarize_timeout_sec: 120     # 事件摘要轻量模型调用超时（秒）。思考型模型首 token 需数十秒，旧硬编码 5s 致摘要全挂、上下文全量回注、token 预算提前烧穿（实证 verify 子 Agent 300K 预算 7 分钟耗尽）
  history_max_messages: 30       # 滑动窗口上限 30 条（system 前缀 + 最近消息），防 token 爆炸；负数表示不裁剪
  tool_call_max_rounds: -1       # ReAct 最大 LLM 轮数（达到上限暂停等待用户续跑，不判失败），负数表示不限制
  retry_count: 1                 # Assistant 任务指数退避重试次数。provider 层已有 3 次重试（retry_provider），此处再重试会乘法放大尝试次数（最多 provider3 × agent(1+n)），瞬时故障已被下层覆盖，1 次足够
  retry_backoff_ms: 100          # 重试初始退避时长（毫秒）
  react_llm_timeout_sec: 600     # ReAct 单次 LLM 调用超时（秒），负数表示仅受会话取消控制。glm-5.2 推理模型 thinking 慢,180s 常被截断,改 600s 给一次调用留够跑完。配合 generate() 不在 deadline 上重试,卡死时 600s 即报错而非 4×180=12min。
  sub_agent_timeout_min: 60      # 子 Agent 独立执行超时（分钟），负数表示不限制。预算抬至 400K 后单 domain 需跑完多文件生成，30min 易在慢推理（thinking）下超时。
  tool_output_history_max_runes: 6000 # 写入历史的单条工具输出最大字符数，负数表示不截断。ReadFile 已改行区间分页（默认 120 行/页，约 4000 字符），6000 保证整页内容完整进入历史，模型无需为"看不见刚读的下半页"重复读取
  token_budget_per_goal: 100000   # 单次目标累计 token 上限（input+output 之和，跨轮累加），超限暂停等用户续跑；<=0 不限制
  token_budget_per_role:          # 按角色单 Agent token 上限（resume 重置；覆盖 token_budget_per_goal）。未列角色按默认:domain 120000 / 叶子助手 40000 / meta 200000(安全网,防不收敛死循环)。入史工具入参截断(2000 runes)后 input 增长受控，但 codegen 输出（thinking 模型含推理 token）单文件可达 15-30K；塔防级多文件任务一次交付不暂停需 domain 400K / 叶子 100K。实证 code_assistant 写 tower.js 撞 100K 截断被迫由 domain 重写返工，编码类叶子抬至 200K。实证 domain 集成走查阶段撞 400K 暂停(第二轮 23:49)，暂停=交付流程中断，抬至 600K 做安全网(摘要走 k3 后上下文收紧,正常不应触顶)。
    domain: 600000
    meta: 400000
    code_assistant: 200000
    ui_assistant: 200000
    prompt_reviewer: 100000
    code_reviewer: 100000
    test_assistant: 600000   # 验证需读全部产出文件+写跑测试，实证 100K 部分回灌导致验证闭环全挂；300K 在塔防级任务单个验证轮 4.5 分钟烧穿（块记忆注入含完整工具输出，每步 ~20K input 重发）
    doc_assistant: 100000
  context_window: 65536          # Agent 上下文窗口（token 数），驱动 TokenBudget 分配与 Watchdog 阈值

  # -- DAG / 会话恢复 --
  dag_enabled: false             # DAG 定时任务调度（默认关闭）
  restore_sessions: false        # 启动时从 session_history 恢复最近 50 个会话到内存（默认 true；TUI 不需要历史记录，显式 false 关闭，启动即为全新会话）

  # -- 多 Agent 协作验证闭环（verifyloop 编排器原生驱动，不依赖主 Agent 提示词）--
  # 接线说明：命中的角色（code_role）子 Agent 成功完成后，dispatcher 在回灌父 Agent 前
  # 同步驱动"自测->修正->上级统一测试"状态机，验证结论以【验证闭环:通过/未通过】前缀并入摘要；
  # verify_and_fix 工具保留给 MetaAgent/DomainAgent 显式复检。验证/修正轮走 ExecuteChild 同步派发，
  # 不递归触发自动验证。
  # 2026-08-08 A/B 实证（test/benchmark/runs/multi-on vs multi-off，同二进制唯一变量=本开关）：
  # 开=5/16 通过率 + 558 万 token（测试助手独占 71%）；关=16/16 + 284 万 token。
  # 机制本身已跑通（VERIFY PASS 出现、0 心跳误杀、0 summarize 失败），但当前形态默认关闭：
  # verifier 按累计 input 计费致文件级验证全部烧穿预算；零件级验证通过≠整品可用；
  # 大量未通过摘要干扰父 Agent 决策致提前收尾。待验证改为"meta 层整品端到端单次验证"后再考虑开启。
  assistant_self_test_enabled: false # code_assistant 等产出角色完成后自动触发"自测->修正->上级统一测试"状态机
  domain_self_test_enabled: false    # 领域 Agent 完成后自动触发模块级统一测试（dispatcher 完成路径已接线）
  verification_max_rounds: 5         # 验证闭环往返上限，防止 code<->test 平级互问死循环
  # 验证角色对：产出角色完成后由测试角色验证。为空时回退默认 [{code_assistant, test_assistant}]。
  # 显式配置可扩展多角色对，如 UI 任务由 test_assistant 验证：
  #   - code_role: ui_assistant
  #     test_role: test_assistant
  verification_role_pairs:
    - code_role: code_assistant
      test_role: test_assistant
  block_memory_write_enabled: true   # 子 Agent 完成后沉淀结果摘要到块记忆知识库

  # -- 强制门（默认全关，基础任务先跑通；Pipeline 重构后整体移除）--
  spec_enforcement_enabled: false    # call_sub_agent 前是否强制 WriteSpec
  plan_skip_enabled: true            # 跳过 verifyloop PlanConfirm 阶段
  review_enabled: false              # verifyloop 插入 code_reviewer 静态审查
  max_total_dispatches: 30           # 单 session 派发总数上限

  # -- 工具沙箱（安全）--
  tool_sandbox_disabled: false   # true 时关闭写路径逃逸检测（保留命令黑名单）
  tool_sandbox_allowed_paths: [] # 允许读写的额外绝对路径白名单
  tool_sandbox_blocked_cmds: []  # 追加到默认命令黑名单的额外命令

# 日志文件输出（按天分割，按入口分文件）
# 后端入口 -> logs/backend/YYYY-MM-DD.log
# TUI 入口 -> logs/tui/YYYY-MM-DD.log
logging:
  enabled: true                  # false 时仅输出到 stderr，不写文件
  dir: logs                      # 日志目录，自动创建
  format: console                # console（纯文本，便于阅读）或 json（结构化）
  level: info                    # debug | info | warn | error
  timezone: Local                # Local | UTC | Asia/Shanghai
  stack_enabled: true            # error 级别是否打印调用栈
  no_color: true                 # 是否禁用 ANSI 颜色，文件日志建议 true
