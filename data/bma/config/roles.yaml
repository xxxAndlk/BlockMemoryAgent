# Agent 角色配置文件
#
# 模型连接参数已外置到同目录 models.json（provider/model/api_key/base_url）：
# 各角色 model_config 以 model_ref 引用条目，本文件只保留行为参数
#（temperature/thinking）。输出上限（max_output_tokens）属模型能力元数据，在
# models.json 条目上维护；角色侧 max_tokens 仅在需要更低上限时显式覆盖（>0 优先）。
# models.json 改动免重启热更新（mtime 检查）；
# 运行时切换（TUI /model、Web 对话栏右下选择器）持久化到 models.json role_bindings。
# 条目可选 selectable_roles 角色白名单：非空时仅列内角色可经切换通道选用
#（如 kimi-k3 仅 ["meta"]，domain/叶子 TUI/Web/set_role_model/set_agent_model 均不可选），
# 绑定（role_bindings/model_ref）不受限。
#
# 提示词不承载于本文件：全部角色系统提示词内置于 pkg/prompts（Go 常量编译进二进制，
# 配置目录不可见/不可改）；本文件残留的 system_prompt/prompt_template 键会被启动加载
# 覆盖忽略。未知固定角色/模板 ID 无法纯配置添加（strict 报错，需在 pkg/prompts 登记）。
#
# 架构：两层编排。MetaAgent 运行单一 ReAct 主循环（LLM -> 工具 -> 结果 -> 循环），
# 通过 call_sub_agent 工具按 role_id 异步派发 DomainAgent（各领域直接执行者，默认自执行）；
# 叶子助手（fixed_roles）保留为可选下拆层，是否启用由 DomainAgent 自主判断。
# 子 Agent 完成后结果摘要经 Mailbox 回灌父 Agent。
#
# provider 支持：
#   - openai-chat：OpenAI Chat Completions 协议（/v1/chat/completions），适用于 OpenAI / DeepSeek / Kimi / GLM / 豆包等；
#     自研实现，内置字段兼容（reasoning_content 回传、max_tokens vs max_completion_tokens 按模型名自适应、usage cache 字段回退）。
#     旧名 openai / openai-deepseek 作为其别名仍可用。
#   - openai-responses：OpenAI Responses API 协议（/v1/responses），适用于 gpt-4.1 / o 系 / gpt-5 等新一代接口。
#   - ollama：Ollama 原生 /api/chat 协议，默认 http://localhost:11434
#   - anthropic：Anthropic 原生 Messages API，默认 https://api.anthropic.com
# openai 系两种格式与 ollama/anthropic 均为自研或原生 SDK 直连，不再统一转单一协议。

# 主Agent (MetaAgent)：会话入口，对最终目标负责。只做派发与汇总，不直接执行。
meta_agent:
  model_config:
    model_ref: doubao-seed-evolving # 连接参数（provider/model/api_key/base_url）见 config/models.json，热更新免重启
    temperature: 0.1
    thinking: low # TODO 第14项 T5（2026-09-14）：meta 是路由/汇总角色，off 档正确率损失未实测，先降 low（4096 budget）观察；同端点实证先例（2026-09-06 对擂）：doubao-seed-evolving 接受 disabled（curl 200/1.1s），max→low→off 逐轮提速（meta 均延 40.1→22.1s→预期 ~10s）。off 留观察：若误派发率上升即回 medium
    # 实证：glm-5.2(thinking) 首个路由调用耗时 ~6.5 分钟反复权衡派发方案，单点即击穿 10 分钟交付目标；
    # 已切换 k3(非推理, 与 domain 同端点)：2026-08-04 基线运行 glm-5.2 路由 3m18s + 汇总多次 thinking 共 322s，
    # k3 路由决策应控制在 1 分钟内，配合下方【派发铁律】提示词。
    # 2026-08-21 成本重排（火山方舟抵扣：k3=10 / glm-5.3=4.5 / evolving=2.5 / flash=0.5）：
    # meta 是最大 token 消耗点（长输入段 ×1~×2 放大），现值 doubao-seed-evolving（抵扣 2.5，
    # Agent 编排/长程规划定位）；kimi-k3（抵扣 10）不留常驻角色，仅在硬骨头任务手动临时切换
    #（TUI /model 或 Web 对话栏右下模型选择器按角色绑定，落 models.json role_bindings）。
  # tools 非空时整体覆盖 registry.go 内置白名单。本配置相对内置默认去掉 HTTPGet：
  # 实证 2026-08-18，MetaAgent 联网永远默认走内置 HTTPGet 硬刮搜索引擎（零摩擦路径依赖），
  # web_search 插件（firecrawl，roles:["meta"]）需要 tool_catalog+tool_mount 两步而从不被选中。
  # 去掉后 meta 联网只能挂 web_search 插件，调研结论钉进 spec 再派发（见派发铁律）。
  # TODO 第15项 T13（2026-09-14）提示词瘦身：meta 收窄为编排/汇总最小集（40→22 个）——
  # 去掉直接执行类（WriteFile/RunCommand/ReadMedia：meta 只派发与汇总，读写自有 domain 承担；
  # 2026-09-07 单循环默认化的"发还"重新收回）、模型/角色管理类（create_role/list_roles/
  # list_models/set_role_model/set_agent_model：运维动作不属任务循环）、项目刷新与记忆类
  # （RefreshProjectDoc/remember_preference/search_knowledge：写侧自动触发 + 检索走 domain）、
  # 插件管理类（plugin_*/tool_catalog/tool_mount/tool_unmount：装机一次性动作，不在任务循环）。
  # 保留读三件（ReadFile/EditFile/RestoreFile）+ SearchInFiles（新增：汇总阶段复核交付物）。
  # 插件工具（web_search 等）不经此列表：由 role_tool_gate 硬门闭包按"角色可见"并集放行
  #（bootstrap.go），Schema 可见性仍走 白名单 ∪（可见 ∧ 已挂载）软过滤。
  tools: [call_sub_agent, call_sub_agents, map_sub_agents, merge_worktree, WriteSharedMemory, ReadSharedMemory, WriteSpec, send_message, cancel_agent, pause_agent, resume_agent, ask_user, write_plan, submit_plan, review_plan, ReadFile, EditFile, RestoreFile, SearchInFiles, ShowArtifact, list_skills, load_skill]

# 领域Agent配置（domain 角色共用模型）
domain_agent:
  model_config:
    model_ref: ark-deepseek-v4-flash # 2026-09-06 对擂实测：ark-glm-5.3-flash domain 单呼均延 57.6s（80 呼 4608s，占总耗时 71%）；evolving 同端点同协议 meta 侧均延 27.6s，切域执行层提速
    temperature: 0
    thinking: medium     # 2026-09-07 恢复 medium（TODO 第八项 P0-1）：off 档正确率损失大于延迟收益（2026-09-06 对擂实测 off 步数翻倍且完成度下滑 round-5 C=0.849），编码执行层须留推理预算；off 仅 meta 这类路由/汇总角色适用。glm 系 ark 端点不支持 disabled（400），仅 doubao 角色可关
  skills: [派发与规格]   # 工具描述精简（P0-3）后字段全语义承接进技能文档，下拆写 spec 拿不准时 load_skill

# 轻量模型配置（用于历史会话总结、检索 query 改写等低开销任务）
# 可指向更便宜更快的模型；留空 model 时回退到 domain_agent 模型
# TODO #40 块 3：轻量模型走 DeepSeek（经 responses 协议代理，provider=openai-responses），
# 自动前缀缓存 + prompt_cache_hit/miss_tokens 字段（provider 端已补原生字段解析，
# 缓存命中/未命中透传进 session_logs，轻量调用纳入命中率统计）。
# 历史注：2026-08-04 曾因 deepseek 端点不稳（503/超时）切 k3；#33 流式化+超时配置化后
# 稳定性问题已缓解，现值 model=ark-deepseek-v4-flash 与端点归一一致。
lightweight_model:
  model_ref: doubao-seed-2.0-mini # 连接参数见 config/models.json
  temperature: 0.2
  max_tokens: 2048 # 角色侧显式覆盖（总结类任务要短上限），优先于模型条目 max_output_tokens

# 文本嵌入模型配置（P3-3）
# provider: pseudo（默认，零依赖字符哈希） | openai（OpenAI 兼容端点） | local（本地 ollama/xinference HTTP 服务） | onnx（进程内 ONNX Runtime，TODO #41 真本地）
# 向量维度需与上方 pgvector.dimensions 一致。
# 2026-08-12 生效配置：provider=local + ollama bge-m3（OpenAI 兼容端点，零 api_key）。
# 注意：base_url 只写主机根路径（EMBEDDING_BASE_URL=http://localhost:11434），客户端自行拼 /v1/embeddings；
# 不要带 /api/embeddings（ollama 原生端点格式）——会拼出 /api/embeddings/v1/embeddings 404。
# onnx（TODO #41，进程内零外部服务方向）：需 -tags onnx 构建 + models/bge-base-zh-v1.5/ 模型文件
# （见 models/README），BGE-base-zh-v1.5 为 768 维；bge-m3 为 1024 维（当前 pgvector.dimensions）。
embed:
  provider: local             # 默认 pseudo；本地 HTTP 服务（ollama/xinference）用 local；进程内真本地改 onnx（-tags onnx）
  model: bge-m3           # ollama 已拉取的嵌入模型；onnx 示例：bge-base-zh-v1.5
  # api_key: ${EMBEDDING_API_KEY}                  # openai 需要；ollama（local）与 onnx 忽略
  base_url: ${EMBEDDING_BASE_URL} # OpenAI 兼容端点根路径（ollama: http://localhost:11434）；onnx 忽略
  batch_size: 1                  # 单次嵌入条数上限
  # model_path: ./models/bge-base-zh-v1.5   # provider=onnx 专用（TODO #41）；默认 ./models/<model>/

# 固定助手角色（配置文件预定义，长期存在，可被 call_sub_agent 派发）
# 两层编排下的可选下拆层：叶子执行者拥有 ReadFile/WriteFile/RunCommand 等执行类工具，
# 但不再拥有 call_sub_agent（不能派发子任务，避免越位）。
# 是否启用叶子由 DomainAgent 按【拆分决策】自主判断，不再是默认路径。
# 产出质量走分层自检 + dispatcher 机器校验：叶子自检（写完即语法检查）-> 领域 Agent 收尾验收 ->
# MetaAgent 纸面交付对照+返工（均为提示词纪律，无独立验证 Agent）；dispatcher 在完成收尾
# 自动执行机器校验（冒烟语法层 #56 / 跨域契约静态层 #57 / 分层验收探针 #59：入口引用图+截图证据）。
# 整品验收 Agent 已切出默认流程（2026-08-24 决策：游戏验收 2h 撞墙钟零收益），
# isVerificationTask 代码钩子已删除（ce43288），保留口子 = domain【集成验证任务模式】提示词段：
# 后续功能需要联调验收时，经 call_sub_agent 派"验证/联调/修复"类 domain 任务即可接入。
# 业务级测试（computer-use 点击页面 / CLI 断言）见 doc/扩展设计_Agent工作流平台.md §12。
fixed_roles:
  # 侦察员（TODO 第七项②，借鉴 Claude Code Explore subagent）：轻量只读定位角色。
  # spec_exempt：侦察本身就是"先定位"的动作，WriteSpec 门对其倒置（豁免 + 缺省墙钟 5 分钟，
  # 见 types.RoleDefinition.SpecExempt 与 dispatchOne 兜底）。不进热驻池（domain-only 硬过滤天然排除）。
  - id: scout
    name: 侦察员
    type: fixed
    description: 轻量只读侦察：在代码库中定位文件/函数/符号/行号，回答一个具体问题
    keywords: ["侦察", "定位", "找", "scout", "explore", "在哪", "哪里"]
    skills: []
    tools: [ReadFile, ListDir, SearchInFiles]
    model_config:
      model_ref: ark-deepseek-v4-flash # 抵扣 0.5 最便宜档；侦察任务短平快，thinking=low 保底推理。连接参数见 config/models.json
      temperature: 0
      thinking: low
    can_be_called: true
    parents: [meta, domain]
    spec_exempt: true

  # 速修手（任务137 轻量修复类型）：查修一体的单点小修角色。scout 只查不改、
  # code_assistant 按规格实现，两者对小修都过度——速修手边查边改一竿到底，
  # 补"根因未知但范围小"场景。spec_exempt：task 本身即规格（现象+线索+边界），
  # 规格门倒置；缺省墙钟 10 分钟（dispatcher 兜底，见 roleDef.ID=="light" 分支）。
  # 不进热驻池（非 domain 天然排除）。
  - id: light
    name: 速修手
    type: fixed
    description: 查修一体速修：定位并直接修复单点小问题（报障/小改，≤3 文件），边查边改一竿到底
    keywords: ["速修", "轻量修复", "小修", "报障", "快速修复", "light", "fix"]
    skills: []
    tools: [ReadFile, ShowArtifact, WriteFile, EditFile, RestoreFile, ListDir, RunCommand, SearchInFiles, GitDiff, GitStatus, load_skill]
    model_config:
      model_ref: ark-deepseek-v4-flash # 同 domain/scout 便宜档；小修短平快 thinking=low 保底推理。连接参数见 config/models.json
      temperature: 0
      thinking: low
    can_be_called: true
    parents: [meta, domain]
    spec_exempt: true

  # 代码助手
  # 角色写沙箱（Layer 4，dormant opt-in）：配置 sandbox.allowed_write_paths 后，
  # 该角色的 WriteFile 仅允许写入指定目录（相对 workDir 或绝对路径），越界拒绝。
  # 样例（当前保持空=不限制，行为不变）：
  #   sandbox:
  #     allowed_write_paths: ["src/", "tests/", "./dist"]
  # 机制由 tool/sandbox.go enforceRoleWritePath 实现（单测 TestEnforceRoleWritePath_* 覆盖）。
  - id: code_assistant
    name: 代码助手
    type: fixed
    description: 专业的代码编写与审查助手，擅长Go/JavaScript/Python等语言
    keywords: ["代码", "编程", "开发", "bug", "修复", "重构", "review", "code"]
    skills: []
    # 只暴露执行类工具；call_sub_agent 由 dispatcher 注册但不在此白名单中。
    tools: [ReadFile, ShowArtifact, WriteFile, EditFile, RestoreFile, ListDir, RunCommand, SearchInFiles, HTTPGet, HTTPPost, GitDiff, GitStatus, GitLog, GitBlame, load_skill]
    model_config:
      model_ref: ark-deepseek-v4-flash # 叶子是最高频角色，规格已被 spec 钉死、单文件闭环，flash（抵扣 0.5）性价比最优；k2.7-code（抵扣 4.5）留作质量不足时的升级档。连接参数见 config/models.json
      temperature: 0.4
      thinking: medium     # 2026-09-07 恢复 medium（TODO 第八项 P0-1）：正确率>延迟，叶子编码同样需要推理预算（历史注：glm-5.2(thinking) 编码单轮分钟级曾拖慢全链路；k3(非推理) 单轮 ~1min；ark-glm-5.3-flash 思考实测单轮均延 459s）
    can_be_called: true

  # UI助手
  - id: ui_assistant
    name: UI助手
    type: fixed
    description: 前端UI/UX设计与实现助手，擅长CSS/HTML/组件开发
    keywords: ["UI", "界面", "前端", "CSS", "HTML", "样式", "布局", "page"]
    skills: []
    tools: [ReadFile, ShowArtifact, WriteFile, EditFile, RestoreFile, ListDir, RunCommand, SearchInFiles, HTTPGet, HTTPPost, GitDiff, GitStatus, GitLog, GitBlame, load_skill]
    model_config:
      model_ref: ark-glm-5.3-flash # gemini-webapi 网关（连接参数见 config/models.json）
      temperature: 0.7
      thinking: low        # 出图/写 UI 执行型角色关思考（同 domain_agent 实证）
    can_be_called: true

  # 提示词审查助手
  - id: prompt_reviewer
    name: 提示词审查助手
    type: fixed
    description: 专门审查和优化AI提示词（Prompt）的助手
    keywords: ["提示词", "prompt", "审查", "优化", "template"]
    skills: []
    tools: [ReadFile, ShowArtifact, WriteFile, EditFile, RestoreFile, ListDir, RunCommand, SearchInFiles, HTTPGet, HTTPPost, GitDiff, GitStatus, GitLog, GitBlame, load_skill]
    model_config:
      model_ref: ark-deepseek-v4-flash # 连接参数见 config/models.json
      temperature: 0.2
      thinking: low        # glm 系 ark 端点不支持 disabled（2026-09-05 实测），改 low=4096 budget（2026-08-21 实证 glm-5.3 默认思考 300s 出不了判定 JSON）
      # TODO #40 块 3：归一 DeepSeek 原生 /chat/completions（openai-chat 别名）——自动前缀缓存
      # + 原生 cache 字段。历史注：2026-08-04 曾因端点不稳切 k3，strict 启动校验拖死风险由
      # VerifyConnectivity 的宽松重试兜底（#33 后已流式化+超时配置化）。
    can_be_called: true

  # 代码审查助手
  - id: code_reviewer
    name: 代码审查助手
    type: fixed
    description: 静态代码审查助手，只读不改，输出结构化 findings
    keywords: ["review", "审查", "code_review"]
    skills: []
    tools: [ReadFile, ListDir, SearchInFiles, GitDiff, GitStatus, GitLog, GitBlame, HTTPGet, load_skill]
    model_config:
      model_ref: ark-deepseek-v4-flash # 同 prompt_reviewer（原 *review_model）：0.2/16384/low。连接参数见 config/models.json
      temperature: 0.2
      thinking: low
    can_be_called: true

  # 测试助手（验收测试员：与 Meta/Domain 同级的交付验收角色，只验收不实现）
  - id: test_assistant
    name: 测试助手
    type: fixed
    description: 验收测试员：模拟人类操作验收交付物，输出测试报告
    keywords: ["测试", "test", "验证", "QA", "assert", "coverage", "验收"]
    skills: []
    spec_exempt: true  # 验收派发由 dispatcher 验收闭环内部发起（Meta 终答后），不走 WriteSpec 门禁
    # tool_catalog/tool_mount 用于按需挂载 web_search / host_computer_use 插件工具（plugins.yaml roles 已授权）。
    tools: [ReadFile, ShowArtifact, WriteFile, EditFile, RestoreFile, ListDir, RunCommand, SearchInFiles, HTTPGet, HTTPPost, GitDiff, GitStatus, GitLog, GitBlame, load_skill, tool_catalog, tool_mount]
    model_config:
      model_ref: ark-deepseek-v4-flash # 连接参数见 config/models.json。deepseek 端点不稳会拖死 strict 启动校验（2026-08-04 实证），统一切 k3
      thinking: medium     # 2026-09-07 恢复 medium（TODO 第八项 P0-1）：正确率>延迟，测试编写同样需要推理预算
    can_be_called: true

  # 文档助手
  - id: doc_assistant
    name: 文档助手
    type: fixed
    description: 技术文档编写与维护助手
    keywords: ["文档", "doc", "README", "注释", "example"]
    skills: []
    tools: [ReadFile, ShowArtifact, WriteFile, EditFile, RestoreFile, ListDir, RunCommand, SearchInFiles, HTTPGet, HTTPPost, GitDiff, GitStatus, GitLog, GitBlame, load_skill]
    model_config:
      model_ref: ark-deepseek-v4-flash # 连接参数见 config/models.json
      temperature: 0.5
      thinking: off       # 执行型角色关思考（同 domain_agent 实证）
    can_be_called: true

  # 快速对话角色（TODO #14 会话三档控制 P0-1）：快速档（gear=fast）会话的直达对话角色。
  # 不进集群编排（无子 Agent 派发/看板/台账）；can_be_called=false 禁止经 call_sub_agent
  # 派发（只由 runSession/resumeSession 按档位选择）；唯一工具 escalate_gear 用于把
  # 会话中识别出的工程任务升档到集群档（TODO #14 升档机制）。提示词内置 pkg/prompts Chat。
  - id: chat
    name: 对话助手
    type: fixed
    description: 快速档直达对话：闲聊/快问快答秒回；工程任务经 escalate_gear 升档
    keywords: []
    skills: []
