# 插件配置（设计文档《插件系统设计 v2》§5）
#
# 约定：
#   - 与 config.yaml 同目录，启动时自动装载；改动后经 POST /api/plugins/reload 生效。
#   - enabled 缺省 false（安全默认，显式开启）；enabled: true 的插件随后端启动自动启用。
#   - 密钥只走 ${VAR} / ${VAR:default} 环境变量插值，不落盘明文。
#   - 外部插件包目录丢进同目录 plugins.d/，经 /api/plugins/reload 扫描装载（不引入 fsnotify）。
#   - 跨实例共享（2026-09-01）：mcp 插件 settings.shared: true 时容器 docker run -d
#     常驻（每会话 docker exec 起独立 MCP server 进程），多开 TUI 复用同一容器；
#     Stop/退出不断开其他实例、不回收容器。容器名全局确定（bma-plugin-<id>），
#     所有实例共用一套；${WORKDIR} 挂载固定为首个创建实例的目录（实例目录不一致
#     时仅告警）。回收/换项目目录重建：docker rm -f bma-plugin-<id>。
#     旧版 pid 后缀容器（bma-plugin-*-<pid>）为升级遗留，可一并清理：
#     docker ps -aq --filter name=bma-plugin- | xargs docker rm -f。
#   - 动态安装（plugin_install 工具，TODO #51）写入同目录 plugins.installed.yaml，
#     原子写且不覆盖本文件；本文件手工条目优先于 installed 条目。
#
# roles 语义（TODO #52 权限天花板，仅人改配置、Agent 不可改）：
#   - 插件 settings.roles 白名单 = 该插件工具可见的 Agent 角色集合（权限声明）；
#     缺省 ["*"] 全角色可见，如需限定改为 ["meta", "domain"] 等显式列表。
#   - destructive 插件（工具全进审批链，如 computer_use）必须显式声明 roles，
#     禁止缺省/["*"] 全角色授权——plugin_install 对破坏性插件强制此校验（拒绝安装）。
#   - 分配关系只由配置文件声明：Agent 只能在天花板内 tool_mount/tools_hint 选用工具，
#     不能修改分配本身（越界挂载/委派被拒绝）。
#   - 运行时：Agent 经 tool_catalog 发现天花板内工具，tool_mount 挂载后下一轮可见
#     （TODO #52 按需挂载，替代全量 schema 注入）。
#
# registry_sources：plugin_search/plugin_install 可查询的远程插件目录 URL 白名单
#（TODO #51 安全门：只查白名单来源，防 Agent 拉任意来源）。契约：GET 返回
# {"servers":[{"server":{name,title,description,version,remotes:[{type,url}],
# packages:[{registryType,identifier,transport}]}}]}（MCP 官方 registry 格式）。
# 空 = 缺省官方端点 https://registry.modelcontextprotocol.io/v0/servers。
registry_sources:
  - https://registry.modelcontextprotocol.io/v0/servers
plugins:
  # 联网搜索：firecrawl 官方云端托管 MCP（免 key 会话）。
  # 2026-09-15 切换：本地自托管栈判退——实测本地 search 返回空结果（data:{}，CN 网络
  # 到 Google/DDG 搜索源不可达），且全栈常驻约 3.5GB 内存；云端实测 search 1-2s 出真
  # 结果、scrape 0.9-12s、连发 6 次无限速。本地栈已撤（compose 文件与镜像保留在
  # docker/docker-compose.firecrawl.yml，需要时可按下方"备选 1"重新拉起）。
  # 免 key 会话仅暴露 firecrawl_search / firecrawl_scrape / firecrawl_parse（有限速）；
  # 要 crawl/map/agent 等全工具与更高配额：firecrawl.dev 注册取 key 走 stdio npx
  #（需 mcpbridge 增加自定义 header 支持才能走 http 带 Authorization，见备选 2）。
  web_search:
    kind: mcp
    enabled: true
    settings:
      transport: http
      url: https://mcp.firecrawl.dev/v2/mcp
      # 备选 1（本地自托管栈，数据不出本机；前置：docker compose -f
      # docker/docker-compose.firecrawl.yml up -d + docker build -t bma/firecrawl-mcp:local
      # docker/firecrawl-mcp）：
      # transport: docker
      # image: bma/firecrawl-mcp:local
      # shared: true
      # exec_command: ["firecrawl-mcp"]
      # env:
      #   FIRECRAWL_API_URL: http://host.docker.internal:3002
      #   FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:self-hosted}
      # 备选 2（云端 API + key，全工具；FIRECRAWL_API_KEY 配在 .env）：
      # transport: stdio
      # command: npx
      # args: ["-y", "firecrawl-mcp"]
      # env:
      #   FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
      # 可见角色：meta + test_assistant——联网调研集中在 MetaAgent（先调研、结论钉进 spec 再派发），
      # 实证 2026-08-18：放给 domain 也不会被选中（内置 HTTPGet 零摩擦），反而两套路径并存。
      # test_assistant（验收测试员）联网核实文件/事实类结论用。
      roles: ["meta", "test_assistant"]

  # Computer Use：高危插件，默认关闭，显式开启（设计文档 §6.2/§6.4）。
  # docker transport：enable 时后端拉起 bma/computer-use-mcp 沙箱容器
  #（Xvfb 虚拟桌面，AI 不直接操作真机；stdio MCP 桥接），disable 即回收。
  # 前置：docker build -t bma/computer-use-mcp:local docker/computer-use
  # noVNC 观察口：http://localhost:6081（经 ports 映射）。
  # destructive: true 使全部工具接入审批守卫链（敏感操作二次确认）。
  # TODO #52：destructive 插件必须显式授权角色（权限天花板红线）——
  # 此处 roles: ["meta"] 声明仅 MetaAgent 可见，禁用全角色默认值。
  # 2026-09-02:沙箱版默认关闭,真机直控改用下方 host_computer_use(stdio 宿主机直起);需要隔离环境时改回 true。
  computer_use:
    kind: mcp
    enabled: false
    settings:
      transport: docker
      image: bma/computer-use-mcp:local
      # 跨实例共享容器（同 web_search 注释）：常驻 keeper 需镜像内 entrypoint.sh
      # 只起 Xvfb 桌面不 exec MCP server（BMA_KEEPER=1 分支，镜像需重建：
      # docker build -t bma/computer-use-mcp:local docker/computer-use）。
      # 注意取舍：共享 = 多开实例共用同一 Xvfb 虚拟桌面，并行操作互相干扰；
      # 换来 6081 noVNC 端口不再多实例冲突（原方案第二个实例 enable 必挂）。
      shared: true
      exec_command: ["node", "/recorder-mcp.js"]
      container_entrypoint: ["/entrypoint.sh"]
      container_env:
        BMA_KEEPER: "1"
      ports: ["6081:6081"]
      destructive: true
      roles: ["meta"]
      # 录屏产物挂载：容器 /workspace 映射宿主工作目录，screen_record 录制的
      # mp4 落 <宿主工作目录>/.bma/videos/，Agent/用户在宿主侧可直接消费。
      volumes: ["${WORKDIR}:/workspace"]
      # screen_record 返回的 4 张关键帧（MCP image content）透传给多模态模型
      #（与 ui_preview 同机制；上限单次 4 张/单张 4MiB，工具侧帧参数已对齐）。
      image_passthrough: true
      # 默认 120s 掐不住 300s 录制 + 抽帧，放开到 600s。
      exec_timeout_sec: 600
      # 全工具描述尾部追加沙箱边界警告（实证 2026-08-25 水果忍者：MetaAgent 用
      # filesystem 落盘基线，实际写入沙箱容器 /root/Desktop/... 宿主不可见，WriteSpec
      # 基线校验 5 连拒被 loop guard 强杀）。文件系统边界必须明示，防模型再走此路。
      # 2026-08-30 更新：接入 /workspace 挂载后边界改写——仅 /workspace 映射宿主
      # 工作目录（screen_record 产物宿主可见），其余容器路径仍宿主不可见。
      tool_description_suffix: "注意：本工具运行在隔离沙箱容器内（Docker Xvfb）。仅 /workspace 目录映射宿主工作目录（screen_record 录屏产物在宿主 <工作目录>/.bma/videos/ 可见）；其余路径（如容器内 Desktop）写文件宿主不可见，不得用于落盘任务产物/基线/项目文件，基线落盘用 WriteSpec 的 baseline_content 参数。"
      # 宿主机直起（备选，AI 直接操作真机，仅调试用）：
      # transport: stdio
      # command: npx
      # args: ["-y", "@zavora-ai/computer-use-mcp"]

  # Host Computer Use:真机 GUI 直控(2026-09-02,替代沙箱 computer_use 的默认形态)。
  # stdio 在宿主机直起 @zavora-ai/computer-use-mcp(与沙箱镜像内同一包,工具面一致):
  # 截图/鼠标/键盘/剪贴板/窗口管理/UIA 直接作用于真机桌面(Windows,SendInput/UIA)。
  # 前置:宿主机 Node 20+(npx 首次运行自动拉包)。
  # destructive: true 全工具进审批守卫链(当前全信任模式 tool_approval_disabled: true 不拦截)。
  # 与沙箱 computer_use 不要同时启用:工具面重叠,模型易混淆。
  # 已知缺口:沙箱版自加的 screen_record 录屏依赖 X11,宿主机版暂不提供。
  host_computer_use:
    kind: mcp
    enabled: true
    settings:
      transport: stdio
      command: npx
      args: ["-y", "@zavora-ai/computer-use-mcp"]
      destructive: true
      # 与 ui_preview（@playwright/mcp）撞名的 browser_find/browser_tabs 已不成问题：
      # 2026-09-15 起 MCP 工具本地注册名统一带插件前缀（host_computer_use__browser_find
      # 与 ui_preview__browser_find 各归各），两侧工具全量保留、无需让位。
      # meta + test_assistant（验收测试员模拟人类连续页面操作验收 UI 类交付物用）。
      roles: ["meta", "test_assistant"]
      # 截图经 image content 回传多模态模型(与 ui_preview 同机制)。
      image_passthrough: true
      # 真机操作一律在会话工作目录语义之外(作用于桌面),工具描述尾部明示风险。
      tool_description_suffix: "注意:本工具直接操作宿主机真实桌面(非沙箱):截图为真机屏幕,鼠标键盘事件作用于真机前台窗口。文件落盘仍用内置 WriteFile/EditFile(会话工作目录),不要用本工具的 filesystem 能力落盘任务产物。"

  # Open Design：UI 设计台（开源 Claude Design 替代品，github.com/nexu-io/open-design）。
  # kind=service：Docker 长驻 HTTP 服务（非 MCP，不注入工具），生命周期与 mcp 插件
  # 一样经 /api/plugins/enable|disable|reload 热插拔（docker run -d / rm -f + 健康探针）。
  # 官方发布镜像 ghcr.io/nexu-io/od（Alpine 单容器，daemon 同端口服务 API + Web UI），
  # 实际使用本地补丁镜像 bma/open-design-daemon:local（docker/open-design-daemon：
  # 仅修 volcengine 生图 size 1024x1024→2048x2048，适配 Agent Plan seedream-5.0-lite）。
  # 访问入口：http://localhost:7456（Basic 认证：用户名 open-design，密码 = OD_API_TOKEN）。
  # 前置：docker build -t bma/open-design-daemon:local docker/open-design-daemon
  # （或 docker/bma-plugin.sh 一把梭）；.env 配 OD_API_TOKEN（openssl rand -hex 32）。
  # 同机多实例：service 插件容器名确定性（bma-plugin-svc-<id>），Start 复用已在
  # 运行的容器——第二个实例不再端口冲突（2026-09-01 起，原 pid 后缀方案已废弃）。
  open_design:
    kind: service
    enabled: true
    settings:
      image: bma/open-design-daemon:local
      ports: ["127.0.0.1:7456:7456"]
      volumes: ["bma-open-design-data:/app/.od"]
      env:
        OD_API_TOKEN: ${OD_API_TOKEN:}
        # ---- 媒体生成统一入口（6 个值全在 .env「媒体生成」块，见 .env.example）----
        # 生图 KEY：同时点亮 volcengine 与 custom-image 两个 provider 槽位
        #（Agent 生图实际走 custom-image = OpenAI 兼容 /images/generations，
        #  baseUrl/model 由下方 sync_files 落盘 media-config.json——daemon 对
        #  这两项无 env 覆盖）。
        ARK_API_KEY: ${IMAGE_KEY:}
        OD_CUSTOM_IMAGE_API_KEY: ${IMAGE_KEY:}
        # 生视频 KEY：OpenAI /videos 协议网关（aihubmix provider 槽位，配
        # VIDEO_PROVIDER=openai）。若切 VIDEO_PROVIDER=volcengine（方舟 tasks
        # 协议），视频 key 复用 ARK_API_KEY（daemon 上游限制：volcengine 槽位
        # 无独立 key），届时 VIDEO_KEY 不生效。
        OD_AIHUBMIX_API_KEY: ${VIDEO_KEY:}
        # 方舟自定义接入点映射（仅 provider=volcengine 且用接入点 id 时需要，
        # daemon 渲染前改写 wire 模型名）：
        # OD_MEDIA_MODEL_ALIASES: {"doubao-seedance-2-0-fast-260128":"ep-xxx"}
      requires_env: ["OD_API_TOKEN"]
      url: http://localhost:7456
      health_url: http://localhost:7456/api/health
      # 生图/生视频 baseUrl + 模型：daemon 对这些项无环境变量覆盖（env 只覆盖
      # apiKey），故经 sync_files 在容器健康就绪后深合并写入容器内
      # /app/.od/media-config.json（volume 持久）。变量未填时展开为空串、该键
      # 跳过（provider 保持 daemon 缺省/容器内旧值）。6 个值统一在 .env 维护。
      sync_files:
        - path: /app/.od/media-config.json
          json:
            providers:
              # 生图（custom-image provider = OpenAI 兼容 /images/generations
              # 直调；model = 发给网关的真实模型名）
              custom-image:
                baseUrl: ${IMAGE_URL:}
                model: ${IMAGE_MODEL:}
              # 生视频（OpenAI /videos 协议，VIDEO_PROVIDER=openai 时用；模型名任意）
              aihubmix:
                baseUrl: ${VIDEO_URL:}
                model: ${VIDEO_MODEL:}
              # 生视频（方舟 tasks 协议，VIDEO_PROVIDER=volcengine 时用；baseUrl
              # 缺省官方地址，仅自定义网关时填 VIDEO_URL 覆盖）
              volcengine:
                baseUrl: ${VIDEO_URL:}
      # 注：service 插件不注入工具也不解析 roles（Tools 恒空），角色门控无意义。

  # ui_design：Agent 画图工具（kind: mcp，2026-08-17 新增）。
  # open_design 守护进程（上方 service 插件）无 MCP 端点，本插件是其 REST API 的
  # stdio MCP 桥（docker/open-design-mcp）：od_image_generate 生成图片（单张 prompt /
  # 批量 prompts 数组桥内顺序串行）并落盘 volumes 映射的宿主目录（返回 workspace
  # 相对路径供 HTML/CSS 引用），od_image_list 列历史产物。
  # 2026-09-04 新增 od_video_generate（文生视频，双协议：方舟 tasks / OpenAI /videos）
  # 与 od_video_list；视频产物 mp4 同机制落盘，HTML <video> 引用。
  # roles（TODO #55 由 ["ui_assistant"] 放宽）：meta 纳入派发考量（MetaAgent 看得见才会把
  # AI 贴图路线写进 spec）；domain 允许领域 Agent 直接出图；ui_assistant 原有专用角色保留。
  # 落盘目录约定（2026-08-18 修订）：产物默认落 <工作目录>/.bma/od-artifacts（草稿/临时用途）；
  # 正式素材由 Agent 用 od_image_generate 的 save_as 参数直落项目静态资源目录（如
  # assets/img/mon-zombie.png），一图一份、禁止事后复制重命名（此前工具只落时间戳中文名，
  # Agent 被迫写脚本复制两份规范名，9 张图变 27 个文件）。下方 volumes 挂整个工作目录，
  # ${WORKDIR} 在插件 Init 时展开为启动目录绝对路径；ui_preview 挂载同一工作目录，
  # file:///workspace/... 可达全部产物。
  # exec_timeout_sec 1200：od_image_generate 支持 prompts 批量（桥内并发生成，上限
  # OD_BATCH_CONCURRENCY 默认 3，daemon 每 task 独立异步无串行限制），
  # 批量 20+ 张 × 单张最长 60s ÷ 并发 3 约 8min；单张场景远低于此上限，放大上限无负面影响
  #（默认 120s 会掐断长任务，单张时代的 240s 又兜不住批量）。
  ui_design:
    kind: mcp
    enabled: true
    settings:
      transport: docker
      image: bma/open-design-mcp:local
      # 跨实例共享容器（同 web_search 注释）：多开 TUI 全局共用同一容器。
      # ${WORKDIR} 挂载 = 首个创建实例的工作目录（全局一套的代价，目录不一致启动时告警）。
      shared: true
      exec_command: ["node", "server.js"]
      # 挂整个工作目录（容器内 /workspace，与 ui_preview 一致）：save_as 可写项目任意子目录。
      volumes: ["${WORKDIR}:/workspace"]
      env:
        OD_API_URL: http://host.docker.internal:7456
        OD_API_TOKEN: ${OD_API_TOKEN:}
        # 生图模型：daemon 目录 id（非上游模型名）。"custom-image" = daemon 内置
        # custom-image provider 的目录条目，真实模型名由守护进程
        # media-config.json providers.custom-image.model 决定（默认
        # doubao-seedream-5.0-lite，Agent Plan 网关唯一可用图像模型）。
        # 改走标准 /api/v3 按量时，可换成 volcengine 目录 id
        # doubao-seedream-3-0-t2i-250415。
        OD_DEFAULT_MODEL: custom-image
        # 缺省产物（未传 save_as 的草稿）返回给 Agent 的宿主侧相对路径前缀（相对工作目录）。
        OD_OUTPUT_REL_PREFIX: .bma/od-artifacts
        # 生视频（od_video_generate）：provider 取 .env VIDEO_PROVIDER（缺省
        # volcengine=方舟 tasks 协议；openai=OpenAI /videos 协议，模型名裸填，
        # 桥自动补 aihubmix- 前缀）。两个模型槽位统一喂 VIDEO_MODEL（同一视频
        # 网关下只需填一个模型名）。视频单条 30s–5min，桥侧超时独立，单位毫秒
        #（缺省 720000=720s，须小于下方 exec_timeout_sec 1200s；图片仍 180s）。
        OD_VIDEO_PROVIDER: ${VIDEO_PROVIDER:openai}
        OD_VOLCENGINE_VIDEO_MODEL: ${VIDEO_MODEL:}
        OD_OPENAI_VIDEO_MODEL: ${VIDEO_MODEL:}
        OD_VIDEO_TIMEOUT_MS: ${OD_VIDEO_TIMEOUT_MS:120000}
      roles: ["meta","domain","ui_assistant"]
      # 1200s：批量 20+ 张 × 单张最长 60s（桥内串行）可能逼近 20min，见上方注释。
      exec_timeout_sec: 1200

  # ui_preview：UI 渲染回显（Agent 的"眼睛"，2026-08-17 新增）。
  # Microsoft Playwright MCP（Apache-2.0，github.com/microsoft/playwright-mcp）：
  # headless Chromium 打开工作目录里的 HTML 页面（如 tower-defense 游戏），
  # 截图 / a11y 快照 / 执行 JS / 读 console——Agent 写完 canvas/CSS 动态 UI 代码后
  # 可自己渲染验证、看图迭代，替代"静态文生图"之外的动态 UI 增强能力。
  # 前置：docker build -t bma/ui-preview-mcp:local docker/ui-preview-mcp
  # （或一把梭：docker/bma-plugin.sh / make bma-plugin 备齐全部插件镜像；
  #  也可直接用官方镜像 mcr.microsoft.com/playwright/mcp:latest，无需构建）。
  # volumes 挂工作目录（rw，${WORKDIR} 占位符 Init 时展开为启动目录绝对路径，
  # 多目录多开实例各自挂载互不串）：容器内 file:///workspace/... 读页面
  #（--allow-unrestricted-file-access 放开 file:// 导航，官方默认封锁；
  #  容器内仅见 /workspace 挂载，文件系统边界即沙箱）；
  # browser_take_screenshot 截图同时落盘 --output-dir（=宿主 <工作目录>/.bma/ui-artifacts）。
  # image_passthrough: true 开启截图回传模型（bridge 提取 image content 经
  # tool.Result.Images 内存透传，仅最新一批进上下文；要求 ui_assistant 模型
  # 支持图片输入，否则端点 400——见 doc/变更.md 2026-08-17 条目）。
  # 冒烟实测（2026-08-17，镜像 @playwright/mcp 0.0.79）两个关键行为：
  # ①--allow-unrestricted-file-access 必需，否则 file:// 导航被官方默认封锁；
  # ②browser_take_screenshot 仅在不传 filename 参数时才回传 image content
  # （传了 filename 只落盘+回文本链接）——Agent 要"看图"时不要指定 filename。
  ui_preview:
    kind: mcp
    enabled: true
    settings:
      transport: docker
      image: bma/ui-preview-mcp:local
      # 跨实例共享容器（同 web_search 注释）：exec_command 对齐官方镜像 ENTRYPOINT
      #（node /app/cli.js --browser chromium --no-sandbox，exec 不继承 ENTRYPOINT
      # 故需显式带上）；settings.args 附加其后。每 exec 会话独立浏览器实例。
      shared: true
      exec_command: ["node", "/app/cli.js", "--browser", "chromium", "--no-sandbox"]
      # 产物落盘目录：截图保存到 <工作目录>/.bma/ui-artifacts（容器内 /workspace/.bma/ui-artifacts）。
      volumes: ["${WORKDIR}:/workspace"]
      # --image-responses 缺省即 allow（截图回 image content），显式写出防误改 omit。
      args: ["--headless", "--output-dir", "/workspace/.bma/ui-artifacts", "--allow-unrestricted-file-access", "--image-responses", "allow"]
      image_passthrough: true
      roles: ["meta","domain","ui_assistant"]
      exec_timeout_sec: 180
